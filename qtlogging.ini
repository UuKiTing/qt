[Rules]
# ===== Debug 构建：全部开启 =====
musicplayer.db.debug=true
musicplayer.db.info=true
musicplayer.player.debug=true
musicplayer.player.info=true
musicplayer.ui.debug=true
musicplayer.ui.info=true
musicplayer.app.debug=true
musicplayer.app.info=true

# ===== Release 构建：只保留 Warning 及以上 =====
# 将上面 *.debug=true 和 *.info=true 改为 false 即可
# musicplayer.db.debug=false
# musicplayer.db.info=false
# musicplayer.player.debug=false
# musicplayer.player.info=false
# musicplayer.ui.debug=false
# musicplayer.ui.info=false
# musicplayer.app.debug=false
# musicplayer.app.info=false